<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JAN 💘</title>
  <meta name="theme-color" content="#ff4d8d" />
  <style>
    :root{
      --bg1:#0b1220; --bg2:#171a2e;
      --card:rgba(15,23,42,.72);
      --text:#e5e7eb; --muted:#a1a1aa;
      --pink:#ff4d8d; --yes:#22c55e; --no:#ef4444;
      --ring: rgba(255,77,141,.35);
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --border: 1px solid rgba(255,255,255,.10);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(255,77,141,.25), transparent 60%),
        radial-gradient(900px 500px at 90% 20%, rgba(34,197,94,.18), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow:hidden;
    }

    .wrap{min-height:100%; display:flex; align-items:center; justify-content:center; padding:18px;}
    .card{
      width:min(560px, 100%);
      background:var(--card);
      border:var(--border);
      backdrop-filter: blur(10px);
      border-radius:22px;
      padding:18px;
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }

    .top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      color:var(--muted); font-size:13px; user-select:none;
    }

    .title{
      margin:14px 0 6px;
      font-size: clamp(26px, 5vw, 36px);
      line-height:1.1;
      letter-spacing:-.02em;
      text-align:center;
    }
    .subtitle{margin:0 0 14px; text-align:center; color:var(--muted); font-size:14px;}
    .hero{
      display:grid;
      gap:12px;
      margin:10px 0 14px;
    }

    .photo{
      width:100%;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      overflow:hidden;
      background: rgba(255,255,255,.03);
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
      aspect-ratio: 16/10;
      position:relative;
    }
    .photo img{
      width:100%; height:100%;
      object-fit:cover;
      display:block;
      transform: scale(1.02);
    }
    .photo .overlay{
      position:absolute; inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,.0), rgba(0,0,0,.50));
      display:flex; align-items:flex-end; justify-content:space-between;
      padding:12px;
      gap:12px;
    }
    .tag{
      display:inline-flex;
      align-items:center; gap:8px;
      padding:8px 10px;
      border-radius:999px;
      background: rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.12);
      font-size:12px;
      color:rgba(255,255,255,.85);
      user-select:none;
      backdrop-filter: blur(6px);
    }

    .questionBox{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      border-radius:18px;
      padding:14px;
    }
    .question{
      font-size: clamp(18px, 3.6vw, 22px);
      text-align:center;
      margin:0 0 8px;
    }
    .hint{
      text-align:center;
      margin:0;
      color:var(--muted);
      font-size:13px;
    }

    .play{
      display:flex;
      gap:10px;
      justify-content:center;
      align-items:center;
      margin-top:12px;
      flex-wrap:wrap;
      position:relative;
      min-height: 60px;
    }
    button{
      border:none;
      padding:14px 16px;
      border-radius:14px;
      font-weight:800;
      font-size:16px;
      color:#07101f;
      cursor:pointer;
      min-width: 160px;
      box-shadow: 0 10px 25px rgba(0,0,0,.28);
      transition: transform .12s ease, filter .12s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }
    button:active{transform: scale(.98)}
    button:focus{outline: 4px solid var(--ring); outline-offset:2px;}
    .yes{background: linear-gradient(180deg, rgba(34,197,94,1), rgba(34,197,94,.78));}
    .no {background: linear-gradient(180deg, rgba(239,68,68,1), rgba(239,68,68,.78)); position:relative; z-index:1000;}

    .toast{
      position:fixed;
      left:50%;
      top:16px;
      transform:translateX(-50%);
      background: rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.12);
      padding:10px 12px;
      border-radius:14px;
      color: rgba(255,255,255,.9);
      font-size:13px;
      backdrop-filter: blur(8px);
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      opacity:0;
      pointer-events:none;
      transition: opacity .2s ease, transform .2s ease;
      z-index:9999;
      max-width:min(540px, 92vw);
      text-align:center;
    }
    .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
    .toast.hide{opacity:0; transform:translateX(-50%) translateY(-6px);}

    .result{
      display:none;
      text-align:center;
      padding:14px 10px 6px;
      margin-top:10px;
      border-top:1px solid rgba(255,255,255,.10);
    }
    .big{font-size:72px; margin-top:6px; animation: pop .6s ease;}
    @keyframes pop{0%{transform:scale(.6); opacity:0} 100%{transform:scale(1); opacity:1}}
    .result h2{margin:10px 0 6px; font-size: clamp(22px, 4.3vw, 30px);}
    .result p{margin:0; color:var(--muted)}
    .footer{margin-top:14px; text-align:center; color:rgba(255,255,255,.45); font-size:12px; user-select:none;}

    .heart{
      position:fixed; left:var(--x); bottom:-40px;
      font-size: 18px; opacity:.92;
      animation: floatUp var(--dur) linear forwards;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.25));
      pointer-events:none; user-select:none;
      z-index: 9998;
    }
    @keyframes floatUp{
      0%{transform: translateY(0) translateX(0) scale(.9); opacity:0}
      12%{opacity:.95}
      100%{transform: translateY(-110vh) translateX(var(--drift)) scale(1.28); opacity:0}
    }

    @media (max-width:360px){
      button{min-width: 145px}
      .card{padding:16px}
    }
  </style>
</head>

<body>
  <div class="toast" id="toast"></div>

  <div class="wrap">
    <div class="card" id="card">
      <div class="top">
        <div class="pill">💘 Solo para JAN</div>
        <div class="pill" id="counter">😈 x0</div>
      </div>

      <h1 class="title">JAN… tengo una pregunta seria 😏</h1>
      <p class="subtitle">Prometo portarme bien… (bueno, más o menos).</p>

      <div class="hero">
        <div class="questionBox">
          <p class="question" id="question">Jan... ¿Me quieres? 💝</p>
          <p class="hint" id="hint">El “NO” existe… pero es tímido.</p>

          <div class="play" id="play">
            <button class="yes" id="yesBtn">Sí, obvio ❤️</button>
            <button class="no"  id="noBtn">No 🙃</button>
          </div>
        </div>
      </div>

      <div class="result" id="result">
        <div class="big">🥰</div>
        <h2>¡Sabía que eras tú, JAN! 💘</h2>
        <p>Ahora toca: abrazo + foto juntos + plan rico. Sin excusas 😌</p>
        <div class="play" style="margin-top:14px">
          <button class="yes" id="shareBtn">Compartir por WhatsApp</button>
        </div>
      </div>

      <div class="footer">Pista: intenta pulsar “No”… si puedes 😈</div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    const card = $("card");
    const play = $("play");
    const yesBtn = $("yesBtn");
    const noBtn = $("noBtn");
    const counter = $("counter");
    const toast = $("toast");
    const result = $("result");
    const hint = $("hint");
    const question = $("question");

    let noTries = 0;
    let lastMove = 0;
    let swappedOnce = false;

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.remove("hide");
      toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => {
        toast.classList.remove("show");
        toast.classList.add("hide");
      }, 1200);
    }

    function spawnHearts(n = 10){
      const emojis = ["💗","💖","💕","💘","💞","❤️"];
      for (let i=0;i<n;i++){
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        const x = Math.random()*100;
        const dur = 2200 + Math.random()*1800;
        const drift = (Math.random()*120 - 60).toFixed(0)+"px";
        h.style.setProperty("--x", x+"vw");
        h.style.setProperty("--dur", dur+"ms");
        h.style.setProperty("--drift", drift);
        document.body.appendChild(h);
        setTimeout(()=>h.remove(), dur+200);
      }
    }

    // El botón NO escapa por toda la ventana y nunca activa el resultado.
    function moveNoButton(extraTroll = false, pointerX = null, pointerY = null) {
      const now = performance.now();
      if (now - lastMove < 95) return;
      lastMove = now;
      noTries++;
      counter.textContent = `😈 x${noTries}`;

      const rect = noBtn.getBoundingClientRect();
      const margin = 12;
      const maxX = Math.max(margin, window.innerWidth - rect.width - margin);
      const maxY = Math.max(margin, window.innerHeight - rect.height - margin);
      let x = margin, y = margin;

      // Se elige una posición alejada del puntero, siempre dentro de pantalla.
      for (let i = 0; i < 50; i++) {
        const candidateX = margin + Math.random() * Math.max(0, maxX - margin);
        const candidateY = margin + Math.random() * Math.max(0, maxY - margin);
        x = candidateX;
        y = candidateY;
        if (pointerX === null || Math.hypot(x + rect.width / 2 - pointerX, y + rect.height / 2 - pointerY) > 190) break;
      }
      noBtn.style.position = "fixed";
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;

      if (noTries === 1) showToast("Uy… casi. Intenta otra vez 😏");
      if (noTries === 2) showToast("JAN, ese botón no coopera 😈");
      if (noTries === 4) showToast("¡Es imposible pillarlo! 💘");
      if (noTries === 7) showToast("Creo que el botón tiene otros planes 🤭");
      if (noTries >= 8) hint.textContent = "El NO no se deja tocar… 💞";
      spawnHearts(extraTroll ? 8 : 3);
    }

    function showResult() {
      play.style.display = "none";
      noBtn.style.display = "none";
      result.style.display = "block";
      spawnHearts(18);
      showToast("Respuesta correcta ✅");
    }

    yesBtn.addEventListener("click", showResult);

    // PC: esquiva incluso antes de que el ratón llegue al botón.
    document.addEventListener("pointermove", (e) => {
      if (e.pointerType !== "mouse" || result.style.display === "block") return;
      const r = noBtn.getBoundingClientRect();
      const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
      const dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
      if (Math.hypot(dx, dy) < 85) moveNoButton(false, e.clientX, e.clientY);
    });

    // Móvil, teclado y clic: ninguna interacción puede seleccionar NO.
    noBtn.addEventListener("pointerdown", e => {
      e.preventDefault();
      moveNoButton(true, e.clientX, e.clientY);
    });
    noBtn.addEventListener("click", e => {
      e.preventDefault();
      e.stopPropagation();
      moveNoButton(true);
    });
    noBtn.addEventListener("focus", () => {
      noBtn.blur();
      moveNoButton(false);
    });

    // WhatsApp share
    $("shareBtn").addEventListener("click", async () => {
      const url = location.href;
      const text = "JAN… mira esto 😏💘";
      try{
        if (navigator.share) {
          await navigator.share({ title: "Una pregunta para JAN 💘", text, url });
        } else {
          window.open(`https://wa.me/?text=${encodeURIComponent(text + " " + url)}`, "_blank");
        }
      }catch(e){}
    });

    // Mini corazones de ambiente
    setInterval(() => {
      if (result.style.display === "block") return;
      spawnHearts(1);
    }, 1900);

    // Init
    spawnHearts(6);
    window.addEventListener("resize", () => {
      if (result.style.display === "block" || noBtn.style.position !== "fixed") return;
      const r = noBtn.getBoundingClientRect();
      noBtn.style.left = `${Math.max(12, Math.min(r.left, window.innerWidth - r.width - 12))}px`;
      noBtn.style.top = `${Math.max(12, Math.min(r.top, window.innerHeight - r.height - 12))}px`;
    });
  </script>
</body>
</html>
